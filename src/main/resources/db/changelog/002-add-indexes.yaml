databaseChangeLog:
  - changeSet:
      id: 002-create-payments-indexes
      author: danik
      changes:
        - createIndex:
            collectionName: payments
            keys: '{ "orderId": 1 }'
            options: '{ "name": "idx_payments_order_id" }'

        - createIndex:
            collectionName: payments
            keys: '{ "userId": 1 }'
            options: '{ "name": "idx_payments_user_id" }'

        - createIndex:
            collectionName: payments
            keys: '{ "status": 1 }'
            options: '{ "name": "idx_payments_status" }'